<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Maple Web</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background: #1e1e1e; }
    #navbar {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      background: #b91c1c;
      gap: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }
    .brand {
      color: white;
      font-weight: bold;
      font-size: 15px;
      margin-right: 8px;
      user-select: none;
    }
    button {
      background: #991b1b;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background: #7f1d1d; }
    input {
      flex: 1;
      padding: 7px 12px;
      border-radius: 20px;
      border: none;
      outline: none;
      font-size: 14px;
    }
    webview { flex: 1; width: 100%; border: none; background: white; }
  </style>
</head>
<body>

  <div id="navbar">
    <span class="brand">🍁 Maple Web</span>
    <button id="back">◀</button>
    <button id="forward">▶</button>
    <button id="reload">↻</button>
    <input type="text" id="url-bar" placeholder="Search or enter website URL..." value="https://google.ca">
    <button id="go">Go</button>
  </div>

  <webview id="view" src="https://google.ca"></webview>

  <script>
    const webview = document.getElementById('view');
    const urlBar = document.getElementById('url-bar');

    function navigate() {
      let url = urlBar.value.trim();
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        if (!url.includes('.')) {
          url = `https://google.ca/search?q=${encodeURIComponent(url)}`;
        } else {
          url = 'https://' + url;
        }
      }
      webview.loadURL(url);
    }

    document.getElementById('go').addEventListener('click', navigate);
    urlBar.addEventListener('keypress', (e) => { if (e.key === 'Enter') navigate(); });
    document.getElementById('back').addEventListener('click', () => { if (webview.canGoBack()) webview.goBack(); });
    document.getElementById('forward').addEventListener('click', () => { if (webview.canGoForward()) webview.goForward(); });
    document.getElementById('reload').addEventListener('click', () => webview.reload());

    webview.addEventListener('did-navigate', (e) => { urlBar.value = e.url; });
    webview.addEventListener('did-navigate-in-page', (e) => { urlBar.value = e.url; });
  </script>

</body>
</html>

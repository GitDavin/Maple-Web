<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Maple Web</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    html, body { width: 100%; height: 112px; overflow: hidden; background: #991b1b; user-select: none; }

    #tab-bar {
      display: flex;
      align-items: center;
      height: 36px;
      background: #7f1d1d;
      padding: 4px 8px 0 8px;
      gap: 4px;
      overflow-x: auto;
    }
    .tab {
      display: flex;
      align-items: center;
      background: #991b1b;
      color: #fca5a5;
      padding: 5px 10px;
      border-radius: 8px 8px 0 0;
      font-size: 12px;
      max-width: 180px;
      min-width: 90px;
      cursor: pointer;
      gap: 6px;
    }
    .tab.active {
      background: #b91c1c;
      color: white;
      font-weight: bold;
    }
    .tab-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tab-close {
      font-size: 13px;
      padding: 0 3px;
      border-radius: 4px;
    }
    .tab-close:hover { background: rgba(0,0,0,0.3); color: white; }
    #new-tab {
      background: transparent;
      color: white;
      border: none;
      font-size: 18px;
      padding: 2px 8px;
      cursor: pointer;
      border-radius: 6px;
    }
    #new-tab:hover { background: #991b1b; }

    #navbar {
      display: flex;
      align-items: center;
      height: 44px;
      padding: 0 12px;
      background: #b91c1c;
      gap: 8px;
    }
    .brand { color: white; font-weight: bold; font-size: 14px; margin-right: 4px; }
    button.nav-btn {
      background: #991b1b; color: white; border: none; padding: 5px 10px;
      border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px;
    }
    button.nav-btn:hover { background: #7f1d1d; }
    #url-bar {
      flex: 1; padding: 6px 12px; border-radius: 20px; border: none; outline: none; font-size: 13px;
    }

    #bookmarks-bar {
      display: flex;
      align-items: center;
      height: 32px;
      padding: 0 12px;
      background: #991b1b;
      gap: 8px;
      border-top: 1px solid #7f1d1d;
      overflow-x: auto;
    }
    .bookmark-item {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #7f1d1d;
      color: white;
      padding: 3px 9px;
      border-radius: 12px;
      font-size: 12px;
      cursor: pointer;
    }
    .bookmark-item:hover { background: #5c1313; }
    .bm-del { opacity: 0.7; font-size: 11px; margin-left: 2px; }
    .bm-del:hover { opacity: 1; color: #fca5a5; }
  </style>
</head>
<body>

  <div id="tab-bar">
    <div id="tabs-container" style="display:flex;gap:4px;"></div>
    <button id="new-tab" title="New Tab">+</button>
  </div>

  <div id="navbar">
    <span class="brand">🍁 Maple Web</span>
    <button class="nav-btn" id="back" title="Back">◀</button>
    <button class="nav-btn" id="forward" title="Forward">▶</button>
    <button class="nav-btn" id="reload" title="Reload">↻</button>
    <button class="nav-btn" id="home" title="Home">🏠</button>
    <input type="text" id="url-bar" placeholder="Search or enter website URL..." value="https://duckduckgo.com">
    <button class="nav-btn" id="bookmark-btn" title="Bookmark this page">★</button>
    <button class="nav-btn" id="go">Go</button>
  </div>

  <div id="bookmarks-bar"></div>

  <script>
    const { ipcRenderer } = require('electron');
    const urlBar = document.getElementById('url-bar');
    const tabsContainer = document.getElementById('tabs-container');
    const bookmarksBar = document.getElementById('bookmarks-bar');
    let currentTitle = 'Maple Web';

    function navigate() {
      let url = urlBar.value.trim();
      if (!url) return;
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = !url.includes('.') ? `https://duckduckgo.com{encodeURIComponent(url)}` : 'https://' + url;
      }
      ipcRenderer.send('nav-go', url);
    }

    document.getElementById('go').addEventListener('click', navigate);
    urlBar.addEventListener('keydown', (e) => { if (e.key === 'Enter') navigate(); });
    document.getElementById('back').addEventListener('click', () => ipcRenderer.send('nav-back'));
    document.getElementById('forward').addEventListener('click', () => ipcRenderer.send('nav-forward'));
    document.getElementById('reload').addEventListener('click', () => ipcRenderer.send('nav-reload'));
    document.getElementById('home').addEventListener('click', () => ipcRenderer.send('nav-home'));
    document.getElementById('new-tab').addEventListener('click', () => ipcRenderer.send('tab-new'));

    ipcRenderer.on('tabs-updated', (e, tabs) => {
      tabsContainer.innerHTML = '';
      tabs.forEach((tab) => {
        if (tab.active) {
          if (document.activeElement !== urlBar) urlBar.value = tab.url;
          currentTitle = tab.title;
        }
        const el = document.createElement('div');
        el.className = 'tab' + (tab.active ? ' active' : '');
        el.innerHTML = `<span class="tab-title">${tab.title}</span><span class="tab-close">×</span>`;
        el.querySelector('.tab-title').addEventListener('click', () => ipcRenderer.send('tab-switch', tab.id));
        el.querySelector('.tab-close').addEventListener('click', (ev) => {
          ev.stopPropagation();
          ipcRenderer.send('tab-close', tab.id);
        });
        tabsContainer.appendChild(el);
      });
    });

    const defaultBookmarks = [
      { title: 'DuckDuckGo', url: 'https://duckduckgo.com' },
      { title: 'GitHub', url: 'https://github.com' }
    ];

    function getBookmarks() {
      const saved = localStorage.getItem('maple_bookmarks');
      return saved ? JSON.parse(saved) : defaultBookmarks;
    }

    function renderBookmarks() {
      const list = getBookmarks();
      bookmarksBar.innerHTML = '';
      list.forEach((bm, idx) => {
        const item = document.createElement('div');
        item.className = 'bookmark-item';
        item.innerHTML = `<span>${bm.title}</span><span class="bm-del">×</span>`;
        item.querySelector('span').addEventListener('click', () => ipcRenderer.send('nav-go', bm.url));
        item.querySelector('.bm-del').addEventListener('click', (ev) => {
          ev.stopPropagation();
          list.splice(idx, 1);
          localStorage.setItem('maple_bookmarks', JSON.stringify(list));
          renderBookmarks();
        });
        bookmarksBar.appendChild(item);
      });
    }

    document.getElementById('bookmark-btn').addEventListener('click', () => {
      const url = urlBar.value.trim();
      if (!url) return;
      const list = getBookmarks();
      const title = currentTitle.slice(0, 18) || url;
      list.push({ title, url });
      localStorage.setItem('maple_bookmarks', JSON.stringify(list));
      renderBookmarks();
    });

    renderBookmarks();
  </script>

</body>
</html>
